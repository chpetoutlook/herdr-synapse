id = "herdr-synapse"
name = "Herdr Synapse"
version = "0.23.0"
min_herdr_version = "0.8.2"
description = "Teams of agents in one Herdr session: roster, charter, shared board, idle-gated nudges"
# +windows: the local Windows port (2026-10-20). Every entrypoint has a Windows
# twin that resolves the plugin root first (the command's cwd is not reliable on
# Windows), and the unix commands are kept verbatim with platforms = ["macos",
# "linux"]. The untouched unix manifest is in herdr-plugin.toml.orig.
platforms = ["macos", "linux", "windows"]

# The Windows root resolution used by every entrypoint below: HERDR_PLUGIN_ROOT
# when Herdr set it, else the plugin_root of this plugin id from
# `herdr plugin list --json`, with the Windows `\\?\` prefix stripped.
# win-root = $p=$env:HERDR_PLUGIN_ROOT; if(-not $p){$b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=(((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-synapse'}|Select-Object -First 1).plugin_root)}; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)};
# win-run  = & (Join-Path (Join-Path $p 'bin') 'herdr-synapse.cmd')

[[startup]]
command = ["./bin/herdr-synapse", "daemon", "start"]
platforms = ["macos", "linux"]

[[startup]]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command",
  '''$u=New-Object System.Text.UTF8Encoding($false); [Console]::OutputEncoding=$u; $OutputEncoding=$u; $p=$env:HERDR_PLUGIN_ROOT; if(-not $p){$b=$env:HERDR_BIN_PATH; if(-not $b){$b='herdr'}; $p=(((& $b plugin list --json|ConvertFrom-Json).result.plugins|?{$_.plugin_id -eq 'herdr-synapse'}|Select-Object -First 1).plugin_root)}; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path (Join-Path $p 'bin') 'herdr-synapse.cmd') 'daemon' 'start' ''']
platforms = ["windows"]

